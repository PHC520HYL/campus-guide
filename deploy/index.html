<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小宸学长 - 江西电力职院新生指南</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }
    
    .container {
      text-align: center;
      padding: 20px;
      max-width: 400px;
      width: 100%;
    }
    
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 4px solid rgba(255,255,255,0.5);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .name {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    
    .title {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 30px;
    }
    
    .tagline {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .tagline p {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 8px;
    }
    
    .tagline p:last-child { margin-bottom: 0; }
    
    .contact-box {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      color: #333;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .contact-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #667eea;
    }
    
    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .contact-item:hover {
      background: #e9ecef;
      transform: translateX(5px);
    }
    
    .contact-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-right: 12px;
    }
    
    .contact-icon.wechat { background: #07c160; }
    .contact-icon.qq { background: #12b7f5; }
    
    .contact-info {
      flex: 1;
      text-align: left;
    }
    
    .contact-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 2px;
    }
    
    .contact-value {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    
    .copy-btn {
      padding: 6px 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .copy-btn:hover { background: #5a67d8; }
    
    .enter-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 16px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s;
      margin-top: 20px;
    }
    
    .enter-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }
    
    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    
    .feature {
      text-align: center;
      font-size: 12px;
      opacity: 0.9;
    }
    
    .feature-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }
    
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    
    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      animation: particle-float 15s infinite;
    }
    
    @keyframes particle-float {
      0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle" style="left:10%;animation-delay:0s;"></div>
    <div class="particle" style="left:30%;animation-delay:2s;"></div>
    <div class="particle" style="left:50%;animation-delay:4s;"></div>
    <div class="particle" style="left:70%;animation-delay:6s;"></div>
    <div class="particle" style="left:90%;animation-delay:8s;"></div>
  </div>
  
  <div class="container">
    <div class="avatar">👨‍�?/div>
    <div class="name">小宸学长</div>
    <div class="title">江西电力职业技术学�?· 新生向导</div>
    
    <div class="tagline">
      <p>🎓 在校学长，亲身经�?/p>
      <p>💡 避坑指南，少走弯�?/p>
      <p>🤝 有问题随时问，有问必�?/p>
      <p>📱 加好友，带你玩转电院</p>
    </div>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">📚</div>
        <div>校园攻略</div>
      </div>
      <div class="feature">
        <div class="feature-icon">💬</div>
        <div>答疑互助</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🎯</div>
        <div>精准避坑</div>
      </div>
    </div>
    
    <div class="contact-box">
      <div class="contact-title">📱 联系�?/div>
      
      <div class="contact-item" onclick="copyText('xiaochen2026')">
        <div class="contact-icon wechat">💬</div>
        <div class="contact-info">
          <div class="contact-label">微信�?/div>
          <div class="contact-value" id="wechat-id">xiaochen2026</div>
        </div>
        <button class="copy-btn">复制</button>
      </div>
      
      <div class="contact-item" onclick="copyText('1234567890')">
        <div class="contact-icon qq">🐧</div>
        <div class="contact-info">
          <div class="contact-label">QQ�?/div>
          <div class="contact-value" id="qq-id">1234567890</div>
        </div>
        <button class="copy-btn">复制</button>
      </div>
    </div>
    
    <a href="江西电力职业技术学院校园指�?html" class="enter-btn">
      🚀 进入校园指南
    </a>
    
    <p style="margin-top:20px;font-size:12px;opacity:0.7;">
      已有 <span id="visitor-count">2,847</span> 位新生加�?    </p>
  </div>
  
  <script>
    function copyText(text) {
      const input = document.createElement('input');
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      
      // 显示提示
      const btn = event.target.closest('.contact-item').querySelector('.copy-btn');
      const originalText = btn.textContent;
      btn.textContent = '已复�?';
      btn.style.background = '#07c160';
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.background = '#667eea';
      }, 2000);
    }
    
    // 动态访客数
    setInterval(() => {
      const count = document.getElementById('visitor-count');
      let num = parseInt(count.textContent.replace(',', ''));
      if (Math.random() > 0.7) {
        num += 1;
        count.textContent = num.toLocaleString();
      }
    }, 5000);
  </script>
</body>
</html>
